services:
  momcozy:
    build: .
    container_name: momcozy-monitor
    restart: unless-stopped
    # Shares the host's IP and network stack (enables local LAN UDP discovery & control):
    network_mode: host
    volumes:
      # Mount single config file (ensure `touch .momcozy.json` exists before running)
      - ./.momcozy.json:/config/.momcozy.json
      # Mount timelapse directory to persist recordings and ring buffer outside container
      - ./timelapse:/timelapse
    devices:
      # Pass through Intel integrated GPU for hardware-accelerated video encoding (VA-API)
      - /dev/dri:/dev/dri
    environment:
      - MOMCOZY_CONFIG=/config/.momcozy.json
      - MOMCOZY_TIMELAPSE_DIR=/timelapse
      # Intel driver for Haswell (Pentium G3220 Gen 7.5). Use iHD for Broadwell (Gen 8) or newer.
      - LIBVA_DRIVER_NAME=i965
      # Optional environment overrides:
      # - MOMCOZY_HWACCEL=auto
      # - MOMCOZY_IP=10.11.2.12
      # - MOMCOZY_PASSWORD=your_password_here
